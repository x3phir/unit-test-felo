version: "3.9"

services:
  postgres-ride:
    image: postgres:16-alpine
    container_name: felo-postgres-ride
    environment:
      POSTGRES_USER: felo
      POSTGRES_PASSWORD: felo
      POSTGRES_DB: ride_db
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felo -d ride_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-matching:
    image: postgres:16-alpine
    container_name: felo-postgres-matching
